name: medicare_app
description: MediCare — medication adherence tracker for elderly and chronic patients, with caregiver linking, OCR label scanning, offline-first sync, and English/Sinhala support.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_messaging: ^15.1.3

  # Local / offline storage
  sqflite: ^2.3.3+1
  path_provider: ^2.1.4
  connectivity_plus: ^6.0.5

  # Camera / OCR
  camera: ^0.11.0+2
  google_mlkit_text_recognition: ^0.14.0
  image_picker: ^1.1.2

  # Local notifications (reminders that fire without internet)
  flutter_local_notifications: ^18.0.1

  # State management
  provider: ^6.1.2

  # Localization
  flutter_localizations:
    sdk: flutter
  intl: 0.20.3

  # UI helpers
  table_calendar: ^3.1.2
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
